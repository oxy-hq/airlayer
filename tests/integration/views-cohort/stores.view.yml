# Peer-cohort fixture: the entity that CARRIES the cohort.
#
# The `size_matched` cohort deliberately reaches ACROSS views for every one of
# its members: the band's `measure`/`per` live on `sales`, while the cohort
# itself is declared on `stores`. That cross-view member resolution is the
# path this fixture exists to exercise end to end.
name: stores
table: stores
entities:
  - name: store_id
    type: primary
    key: store_id
    cohorts:
      # Peers are stores of a similar SALES-PER-TRADING-DAY (never a raw
      # 90-day total, which conflates size with tenure — see `store_g` in
      # the seed), sharing an accounting basis exactly.
      size_matched:
        band:
          measure: sales.net_sales
          per: sales.trading_days
          tolerance: 0.35
        require: [stores.accounting_basis]
        min_peers: 3
dimensions:
  - name: store_id
    type: string
    expr: store_id
  - name: accounting_basis
    type: string
    expr: accounting_basis
