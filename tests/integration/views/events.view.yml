name: events
description: "Product analytics events for integration testing"
table: events

entities:
  - name: event
    type: primary
    key: event_id

dimensions:
  - name: event_id
    type: string
    expr: event_id

  - name: event_type
    type: string
    expr: event_type
    samples: ["page_view", "click", "purchase", "signup"]

  - name: user_id
    type: string
    expr: user_id

  - name: created_at
    type: datetime
    expr: created_at

  - name: country
    type: string
    expr: country

  - name: platform
    type: string
    expr: platform
    samples: ["web", "ios", "android"]

  - name: revenue
    type: number
    expr: revenue_cents / 100.0

  # Boolean dimension whose `expr` is a comparison. Filtering it by equality
  # must parenthesize the expr, otherwise the predicate becomes the invalid
  # chained `event_type = 'purchase' = '...'`.
  - name: is_purchase
    type: boolean
    expr: "event_type = 'purchase'"

  # Boolean dimension whose `expr` is a word-only predicate (`<col> IS NOT NULL`)
  # — the pokehouse `order_selections.is_modifier` shape. This must NOT be quoted
  # whole as the identifier `"country IS NOT NULL"` (#73); it must render as a
  # real predicate against the qualified `country` column.
  - name: has_country
    type: boolean
    expr: "country IS NOT NULL"

measures:
  - name: total_events
    type: count
    description: "Total event count"

  - name: unique_users
    type: count_distinct
    expr: user_id

  - name: total_revenue
    type: sum
    expr: revenue_cents / 100.0

  - name: avg_revenue
    type: average
    expr: revenue_cents / 100.0

  - name: purchase_count
    type: count
    description: "Number of purchase events"
    filters:
      - expr: "event_type = 'purchase'"

  # Same count as `purchase_count`, but the filter references the sibling
  # `is_purchase` dimension by BARE name `{{is_purchase}}` (no view prefix) —
  # the pokehouse `valid_orders` / `voided_orders` shape. airlayer must expand
  # the bare ref to `{{events.is_purchase}}` and resolve it to the dimension's
  # expr (#73), not leave an unresolvable `{{ "events"."is_purchase" }}`.
  - name: purchase_count_via_ref
    type: count
    description: "Purchase events, filtered via a bare member ref"
    filters:
      - expr: "{{is_purchase}} = true"

segments:
  - name: web_only
    expr: "platform = 'web'"
    description: "Only web platform events"
