name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "contrib/**"
      - "sdk-dart/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "contrib/**"
      - "sdk-dart/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --features exec -- -D warnings

  test-tier1:
    name: "Tier 1: Unit + DuckDB/SQLite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  test-tier2:
    name: "Tier 2: Postgres/MySQL/ClickHouse"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: airlayer_test
          POSTGRES_USER: airlayer
          POSTGRES_PASSWORD: airlayertest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airlayer"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: airlayer_test
          MYSQL_USER: airlayer
          MYSQL_PASSWORD: airlayertest
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24-alpine
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Seed databases
        run: |
          PGPASSWORD=airlayertest psql -h localhost -U airlayer -d airlayer_test -f tests/integration/seed/postgres.sql
          mysql -h 127.0.0.1 -u airlayer -pairlayertest airlayer_test < tests/integration/seed/mysql.sql
          curl -s 'http://localhost:8123/' --data-binary @tests/integration/seed/clickhouse.sql

      - name: Run tier 1 + 2 tests
        env:
          AIRLAYER_PG_PORT: "5432"
          AIRLAYER_MYSQL_PORT: "3306"
          AIRLAYER_CH_HTTP_PORT: "8123"
          # Tier 2 links 5 test binaries against every exec driver. With the
          # default 4-way parallelism the runner's ld (SIGBUS) on the ubuntu
          # hosted image. Cap jobs so peak link-time memory stays in budget.
          CARGO_BUILD_JOBS: "2"
        run: cargo test --features exec --jobs 2 -- --include-ignored

  dart-sdk:
    name: "Dart SDK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: dart-lang/setup-dart@v1

      - name: Build libairlayer (ffi cdylib)
        run: cargo build --release --no-default-features --features ffi

      - name: Install Dart deps
        working-directory: sdk-dart
        run: dart pub get

      - name: Analyze Dart
        working-directory: sdk-dart
        run: dart analyze

      - name: Run Dart tests
        working-directory: sdk-dart
        env:
          AIRLAYER_LIB: ${{ github.workspace }}/target/release/libairlayer.so
        run: dart test

  # Tier 3 runs only on main (post-merge) — needs cloud credentials
  test-tier3:
    name: "Tier 3: Cloud warehouses"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-tier1, test-tier2]
    environment: cloud-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: airlayer_test
          POSTGRES_USER: airlayer
          POSTGRES_PASSWORD: airlayertest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airlayer"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: airlayer_test
          MYSQL_USER: airlayer
          MYSQL_PASSWORD: airlayertest
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24-alpine
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Seed databases
        run: |
          PGPASSWORD=airlayertest psql -h localhost -U airlayer -d airlayer_test -f tests/integration/seed/postgres.sql
          mysql -h 127.0.0.1 -u airlayer -pairlayertest airlayer_test < tests/integration/seed/mysql.sql
          curl -s 'http://localhost:8123/' --data-binary @tests/integration/seed/clickhouse.sql

      # A cloud test with no credentials returns early and reports `ok`, so an
      # empty secret is indistinguishable from a passing suite. Check every
      # required secret here, before the test binary, so the failure names the
      # cause instead of surfacing as a panic mid-suite.
      - name: Preflight - required cloud credentials
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_SERVICE_ACCOUNT_KEY: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: |
          missing=()
          for var in \
            SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_PASSWORD \
            BIGQUERY_PROJECT_ID BIGQUERY_SERVICE_ACCOUNT_KEY \
            MOTHERDUCK_TOKEN \
            DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID
          do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Tier-3 cloud tests need these secrets set and non-empty in the 'cloud-tests' environment: ${missing[*]}"
            exit 1
          fi
          echo "All required cloud credentials are present."

      # Compile before minting the BigQuery token, not after. A cold build here
      # (rust-cache saves nothing from a failing job, and tier-3's cache key is
      # its own job id) compiles the bundled duckdb/rusqlite C amalgamations
      # plus the whole exec suite — long enough on a 2-core runner to burn most
      # of the token's 3600s default lifetime before the BigQuery tests run,
      # which then fail with a 401 that looks like a permissions problem.
      # Same job cap as tier 2: see the CARGO_BUILD_JOBS comment there.
      - name: Build test binaries
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --features exec --jobs 2 --no-run

      # BigQuery access tokens live ~1 hour, so a stored token secret is expired
      # essentially always. Mint a fresh one per run from a service-account key.
      # Requires the BIGQUERY_SERVICE_ACCOUNT_KEY secret: the full JSON key of a
      # service account with BigQuery Job User + Data Editor on the test project.
      # access_token_lifetime is left at the 3600s default — raising it beyond
      # 1h needs the service account allow-listed for extended credential
      # lifetimes (constraints/iam.allowServiceAccountCredentialLifetimeExtension).
      - name: Authenticate to Google Cloud (BigQuery)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT_KEY }}
          token_format: access_token

      - name: Run all tests
        env:
          AIRLAYER_PG_PORT: "5432"
          AIRLAYER_MYSQL_PORT: "3306"
          AIRLAYER_CH_HTTP_PORT: "8123"
          # Tier 3 links the same 5 test binaries against every exec driver as
          # tier 2, on the same hosted image; without the cap the runner's ld
          # hits SIGBUS. See the tier-2 job for the original diagnosis.
          CARGO_BUILD_JOBS: "2"
          # Turn "no credentials, skip quietly" into a hard failure. Without
          # this the whole tier-3 suite can pass without touching a warehouse.
          AIRLAYER_REQUIRE_CLOUD_TESTS: "1"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          # The tests read BIGQUERY_PROJECT; the secret is named BIGQUERY_PROJECT_ID.
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: cargo test --features exec --jobs 2 -- --include-ignored
